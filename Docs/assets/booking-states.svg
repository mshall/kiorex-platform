<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 330" width="1100" height="330" role="img" aria-label="Booking state machine" font-family="Jost, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Booking state machine</title>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3730A3"/><stop offset="1" stop-color="#0369A1"/></linearGradient>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3730A3"/></marker>
<marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E8735E"/></marker></defs>
<rect width="1100" height="330" rx="18" fill="#F4F6FC"/>
<rect x="0" y="0" width="1100" height="6" rx="3" fill="url(#g)"/><text x="32" y="46" font-size="22" font-weight="600" fill="#1E1B4B">Booking intent lifecycle</text><text x="32" y="68" font-size="13" fill="#475569">Hold, confirm with an Idempotency-Key, never a new key on uncertainty (KX-09 section 05).</text><rect x="40" y="110" width="150" height="56" rx="10" fill="#fff" stroke="#3730A3" stroke-width="1.6"/>
<text x="115" y="143" text-anchor="middle" font-size="12" font-weight="600" fill="#1E1B4B">SEARCH</text><rect x="220" y="110" width="150" height="56" rx="10" fill="#fff" stroke="#3730A3" stroke-width="1.6"/>
<text x="295" y="143" text-anchor="middle" font-size="12" font-weight="600" fill="#1E1B4B">HELD</text><rect x="400" y="110" width="180" height="56" rx="10" fill="#fff" stroke="#3730A3" stroke-width="1.6"/>
<text x="490" y="143" text-anchor="middle" font-size="12" font-weight="600" fill="#1E1B4B">PENDING_PAYMENT</text><rect x="620" y="110" width="150" height="56" rx="10" fill="#E0F2FE" stroke="#0369A1" stroke-width="1.6"/>
<text x="695" y="143" text-anchor="middle" font-size="12" font-weight="600" fill="#1E1B4B">CONFIRMED</text><rect x="820" y="110" width="150" height="56" rx="10" fill="#fff" stroke="#3730A3" stroke-width="1.6"/>
<text x="895" y="143" text-anchor="middle" font-size="12" font-weight="600" fill="#1E1B4B">COMPLETED</text><path d="M190 138L220 138" stroke="#3730A3" stroke-width="1.8" fill="none" marker-end="url(#a)"/><path d="M370 138L400 138" stroke="#3730A3" stroke-width="1.8" fill="none" marker-end="url(#a)"/><path d="M580 138L620 138" stroke="#3730A3" stroke-width="1.8" fill="none" marker-end="url(#a)"/><path d="M770 138L820 138" stroke="#3730A3" stroke-width="1.8" fill="none" marker-end="url(#a)"/><rect x="220" y="230" width="150" height="50" rx="10" fill="#fff" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="295" y="260" text-anchor="middle" font-size="11" font-weight="600" fill="#1E1B4B">EXPIRED / RELEASED</text><path d="M295 166L295 230" stroke="#E8735E" stroke-width="1.8" fill="none" marker-end="url(#c)"/><rect x="400" y="230" width="180" height="50" rx="10" fill="#FFF1EE" stroke="#E8735E" stroke-width="1.6"/>
<text x="490" y="252" text-anchor="middle" font-size="12" font-weight="600" fill="#1E1B4B">HELD + UNCERTAIN</text><text x="490" y="270" text-anchor="middle" font-size="11" fill="#475569">timeout / 5xx: GET /bookings/:ref</text><path d="M480 166L480 230" stroke="#E8735E" stroke-width="1.8" fill="none" marker-end="url(#c)"/><rect x="620" y="230" width="150" height="50" rx="10" fill="#fff" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="695" y="252" text-anchor="middle" font-size="12" font-weight="600" fill="#1E1B4B">CANCELLED</text><text x="695" y="270" text-anchor="middle" font-size="11" fill="#475569">refund by policy</text><path d="M695 166L695 230" stroke="#E8735E" stroke-width="1.8" fill="none" marker-end="url(#c)"/><rect x="820" y="230" width="150" height="50" rx="10" fill="#fff" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="895" y="252" text-anchor="middle" font-size="12" font-weight="600" fill="#1E1B4B">NO_SHOW</text><text x="895" y="270" text-anchor="middle" font-size="11" fill="#475569">deposit forfeited</text><path d="M895 166L895 230" stroke="#E8735E" stroke-width="1.8" fill="none" marker-end="url(#c)"/><path d="M40 308h357l51-8l71.416l71.4-22l61.19999999999999614h408" stroke="#E8735E" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
